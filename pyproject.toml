[project]
name = "pusher-local"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "psutil==7.2.2",
    "pydantic-settings==2.16.3",
    "python-jose[cryptography]==3.5.0",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["supporting files/testing/unit"]
asyncio_default_fixture_loop_scope = "function"
